
name: Build GreenLeaf Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org in.greenleaf --project-name greenleaf_mobile_preview

      - name: Configure app name and icon
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, shutil

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          data = manifest.read_text(encoding='utf-8')
          data = re.sub(
              r'android:label="[^"]*"',
              'android:label="GreenLeaf Test"',
              data,
              count=1
          )
          manifest.write_text(data, encoding='utf-8')

          for dpi in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              src = Path(f'branding/android/ic_launcher_{dpi}.png')
              if src.exists():
                  dest = Path(
                      f'android/app/src/main/res/mipmap-{dpi}/ic_launcher.png'
                  )
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
          PYTHON

      - name: Install dependencies
        run: flutter pub get

      - name: Verify project files
        run: |
          test -s assets/index.html
          test -s lib/main.dart
          flutter analyze lib

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreenLeaf-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
